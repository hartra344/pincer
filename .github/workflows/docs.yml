name: Docs

# Builds the website when it changes. Docs-only changes skip the macOS job in tests.yml.
on:
  pull_request:
    paths: ["website/**", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  website:
    name: Website build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
