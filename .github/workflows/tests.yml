name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # File hashing keeps a restored build cache incremental (checkout gives every file a new mtime);
  # CI never reads the index store.
  SWIFT_FLAGS: -Xswiftc -enable-incremental-file-hashing --disable-index-store
  # Only main saves build caches. Pull requests restore main's, so they can't evict them from the
  # repository's 10 GB cache.
  SAVE_CACHES: ${{ github.event_name == 'push' || github.head_ref == 'hartra344-cut-ci-time-to-10-minutes' }}

jobs:
  # Docs- and website-only changes skip the jobs below (docs.yml builds the website instead).
  # A job-level `if` rather than `paths-ignore`: the ruleset requires both checks, and a skipped job
  # counts as passing, whereas a workflow that never starts leaves them pending forever.
  # The jobs run unless this says `false`, so if it fails they still run.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ios_shards: ${{ steps.filter.outputs.ios_shards }}
    steps:
      - name: Anything besides docs?
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Lists the changed files (and a rename's old path), or fails (and so runs everything) when it can't tell.
          changed_files() {
            case "$EVENT" in
              pull_request) gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' ;;
              push)
                case "$BEFORE" in ''|0000000000000000000000000000000000000000) return 1 ;; esac
                # Compare lists at most 300 files; a force push isn't "ahead".
                gh api "repos/$REPO/compare/$BEFORE...$AFTER" \
                  --jq 'if .status == "ahead" and (.files | length) < 300 then .files[] | .filename, (.previous_filename // empty) else error("full run") end' ;;
              *) return 1 ;;
            esac
          }
          # Docs only: the website, docs/ and top-level Markdown or LICENSE files.
          docs='^(website/|docs/|[^/]+\.md$|LICENSE$)'
          listed=false
          if files="$(changed_files)" && [ -n "$files" ]; then
            listed=true
            printf 'Changed files:\n%s\n' "$files"
            if grep -qvE "$docs" <<<"$files"; then code=true; else code=false; fi
          else
            echo "Couldn't list the changed files for this $EVENT; running everything."
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Full run: $code"
          # SVGRasterizerTests spend minutes on a cold WebKit, so a pull request runs them only when it
          # touches SVG rendering, the package manifest or this CI. Main always runs them, before TestFlight.
          svg='(^|/)[^/]*SVG[^/]*$|^Package\.(swift|resolved)$|^scripts/ci-|^\.github/workflows/tests\.yml$'
          if [ "$EVENT" = pull_request ] && $listed && ! grep -qE "$svg" <<<"$files"; then
            shards='["hosted","lists"]'
          else
            shards='["hosted","lists","svg"]'
          fi
          echo "ios_shards=$shards" >> "$GITHUB_OUTPUT"
          echo "iOS simulator shards: $shards"

  mock-gateway:
    name: Mock gateway selftest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mock-gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mock-gateway/package-lock.json
      - run: npm ci
      - run: npm run selftest

  # The Swift jobs build for macOS only, so code behind `#if os(iOS)` would otherwise first be
  # compiled by a TestFlight archive (#421). This mirrors that archive, minus signing. Pull requests
  # compile the iOS app in Debug through "iOS app UI tests"; this Release build runs on main, whose
  # green run gates TestFlight (scripts/check_release_ci.py), and on manual runs.
  ios:
    name: iOS build
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.changes.outputs.code != 'false' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        id: xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"

      # The release zip takes seconds; `brew install` took minutes.
      - name: Install XcodeGen
        run: |
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Build the iOS app
        run: |
          xcodegen generate --quiet
          xcodebuild build \
            -project Pincer.xcodeproj \
            -scheme Pincer-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            | { command -v xcbeautify >/dev/null && xcbeautify || cat; }
          exit "${PIPESTATUS[0]}"

  # The Swift jobs run the tests on macOS, where the UIKit list never loads. These run the transcript
  # suites (hosted UIKit list, Dynamic Type parity, controller) and SVG rendering against an iPhone
  # simulator, split across parallel runners by scripts/ci-ios-shard.sh. The simulator boots while
  # the shard builds. One process hosting every suite starved the timeout-bounded tests (#643).
  ios-tests:
    name: iOS simulator tests (${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.ios_shards || '["hosted","lists","svg"]') }}
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        id: xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"

      - name: Pick and boot an iPhone simulator
        id: sim
        run: scripts/ci-boot-simulator.sh ${{ matrix.shard == 'svg' && '--warm-webkit' || '' }} >> "$GITHUB_OUTPUT"

      # Every shard builds the same products. Checkout gives every file a new mtime, so file hashing
      # keeps a restored build incremental.
      - name: Restore the build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .build/xcode-ios
          key: xcode-ios-tests-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**') }}
          restore-keys: xcode-ios-tests-${{ steps.xcode.outputs.version }}-

      # Pincer-Package would also build the macOS-only PincerChecks and PincerMacDev for iOS.
      - name: Build for testing
        id: build
        run: |
          set -o pipefail
          scripts/ios-test-scheme.sh
          xcodebuild build-for-testing \
            -scheme PincerUITests-iOS \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            -derivedDataPath .build/xcode-ios \
            COMPILER_INDEX_STORE_ENABLE=NO OTHER_SWIFT_FLAGS='$(inherited) -enable-incremental-file-hashing' \
            | { command -v xcbeautify >/dev/null && xcbeautify || cat; }

      - name: Save the build cache
        if: ${{ env.SAVE_CACHES == 'true' && matrix.shard == 'hosted' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .build/xcode-ios
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Test on iOS
        run: |
          set -o pipefail
          xcrun simctl bootstatus '${{ steps.sim.outputs.udid }}' -b > /dev/null
          cat "$RUNNER_TEMP/simulator-boot.log" || true
          xcodebuild test-without-building \
            -scheme PincerUITests-iOS \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            -derivedDataPath .build/xcode-ios \
            $(scripts/ci-ios-shard.sh '${{ matrix.shard }}') \
            | { command -v xcbeautify >/dev/null && xcbeautify || cat; }

  # Drives the real app on the simulator: the Browser sheet must leave the compact chat header untouched (#1026).
  ios-app-tests:
    name: iOS app UI tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        id: xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"

      - name: Pick and boot an iPhone simulator
        id: sim
        run: scripts/ci-boot-simulator.sh >> "$GITHUB_OUTPUT"

      # The release zip takes seconds; `brew install` took minutes.
      - name: Install XcodeGen
        run: |
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Restore the build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .build/xcode-app-uitests
          key: xcode-app-uitests-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved', 'project.yml', 'Sources/**', 'Apps/**', 'Tests/PincerAppUITests/**') }}
          restore-keys: xcode-app-uitests-${{ steps.xcode.outputs.version }}-

      - name: Build the app and its UI tests
        run: |
          set -o pipefail
          xcodegen generate --quiet
          xcodebuild build-for-testing \
            -project Pincer.xcodeproj \
            -scheme PincerAppUITests-iOS \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            -derivedDataPath .build/xcode-app-uitests \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -enable-incremental-file-hashing' \
            | { command -v xcbeautify >/dev/null && xcbeautify || cat; }

      - name: Save the build cache
        if: ${{ env.SAVE_CACHES == 'true' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .build/xcode-app-uitests
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: UI-test the Browser sheet header on iOS
        run: |
          set -o pipefail
          xcrun simctl bootstatus '${{ steps.sim.outputs.udid }}' -b > /dev/null
          xcodebuild test-without-building \
            -project Pincer.xcodeproj \
            -scheme PincerAppUITests-iOS \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            -derivedDataPath .build/xcode-app-uitests \
            | { command -v xcbeautify >/dev/null && xcbeautify || cat; }

  # The unit tests and the PincerChecks modes run on separate runners, each building only what it runs.
  swift-shards:
    name: Swift ${{ matrix.shard }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [unit, checks]
    env:
      PINCER_KEYCHAIN: memory
      CHECKS_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        id: xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: matrix.shard == 'checks'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mock-gateway/package-lock.json

      - name: Install mock gateway dependencies
        if: matrix.shard == 'checks'
        working-directory: mock-gateway
        run: npm ci

      # Checkout gives every file a new mtime, so file hashing keeps the restored build incremental.
      # Each shard builds a different set of products, so each keeps its own cache; the last key is
      # the cache from before the shards, which built everything.
      - name: Restore the build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: swiftpm-${{ matrix.shard }}-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**') }}
          restore-keys: |
            swiftpm-${{ matrix.shard }}-${{ runner.os }}-${{ steps.xcode.outputs.version }}-
            swiftpm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      # The unit shard needs the test bundle; the checks shard only the two executables.
      - name: Build
        run: |
          if [ "$CHECKS_SHARD" = unit ]; then
            swift build --build-tests $SWIFT_FLAGS
          else
            swift build --product PincerChecks $SWIFT_FLAGS
            swift build --product PincerMacDev $SWIFT_FLAGS
          fi

      - name: Save the build cache
        if: ${{ env.SAVE_CACHES == 'true' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # Below the job's limit, so a hung lane still leaves its logs for the upload step.
      - name: Run the ${{ matrix.shard }} lanes
        timeout-minutes: 15
        env:
          CHECKS_LOG_DIR: ${{ runner.temp }}/checks
        run: scripts/run-checks.sh $SWIFT_FLAGS

      # Opens a window: switching chats must not rebuild toolbar items, or the sidebar's buttons
      # flash (#262). Kept out of run-checks.sh so local runs don't pop up windows.
      - name: Toolbar stability on chat switch
        if: matrix.shard == 'checks'
        timeout-minutes: 3
        env:
          PINCER_DEV_NAMESPACE: toolbar-check
        run: |
          BIN="$(swift build --show-bin-path $SWIFT_FLAGS)"
          "$BIN/PincerMacDev" --toolbar-stability-check

      # Switching chats keeps the chat view and only swaps its model (#571). Shared runners and a
      # debug build: the timings are reported, and only a gross regression of the median of all 28
      # switches fails. ChatSwitchReuseHostedTests and SelectionDefaultsWriteTests guard the fix itself.
      - name: Chat switch time
        if: matrix.shard == 'checks'
        timeout-minutes: 3
        env:
          PINCER_DEV_NAMESPACE: switch-probe
          PINCER_SWITCH_CHATS: "7"
          PINCER_SWITCH_BUDGET_MS: "1000"
          PINCER_SWITCH_OVERALL_MS: "500"
        run: |
          BIN="$(swift build --show-bin-path $SWIFT_FLAGS)"
          "$BIN/PincerMacDev" --chat-switch-probe

      # The app must go idle after launch (#119, #135): the debug build above, with the menu bar item
      # off, on, and on with the demo connected. The 50% ceiling only catches runaway update loops
      # (the #119 loop sat near 100%); anything tighter flakes on shared runners. Nightly
      # launch-cpu.yml holds a release build to the script's default 5%.
      - name: Launch CPU
        if: matrix.shard == 'checks'
        timeout-minutes: 4
        run: |
          BIN="$(swift build --show-bin-path $SWIFT_FLAGS)"
          for mode in "--menu-bar off" "--menu-bar on" "--menu-bar on --demo"; do
            echo "Launch CPU check: $mode"
            scripts/check-launch-cpu.sh $mode --threshold 50 --samples 6 "$BIN/PincerMacDev"
          done

      - name: Upload check logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/checks
            build/cpu-check-state/app.log
          if-no-files-found: ignore

  # The ruleset requires this name. It passes when every shard passed (or was skipped for a docs-only
  # change) and fails when any failed or was cancelled.
  swift:
    name: Swift build and checks
    needs: [changes, swift-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Swift shard passed
        env:
          RESULT: ${{ needs.swift-shards.result }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          echo "Detect changes: $CHANGES; Swift shards: $RESULT"
          case "$RESULT" in
            success) ;;
            skipped) [ "$CHANGES" = success ] ;;  # skipped only counts for a docs-only change
            *) exit 1 ;;
          esac
