name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Docs- and website-only changes skip the jobs below (docs.yml builds the website instead).
  # A job-level `if` rather than `paths-ignore`: the ruleset requires both checks, and a skipped job
  # counts as passing, whereas a workflow that never starts leaves them pending forever.
  # The jobs run unless this says `false`, so if it fails they still run.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Anything besides docs?
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Lists the changed files (and a rename's old path), or fails (and so runs everything) when it can't tell.
          changed_files() {
            case "$EVENT" in
              pull_request) gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' ;;
              push)
                case "$BEFORE" in ''|0000000000000000000000000000000000000000) return 1 ;; esac
                # Compare lists at most 300 files; a force push isn't "ahead".
                gh api "repos/$REPO/compare/$BEFORE...$AFTER" \
                  --jq 'if .status == "ahead" and (.files | length) < 300 then .files[] | .filename, (.previous_filename // empty) else error("full run") end' ;;
              *) return 1 ;;
            esac
          }
          # Docs only: the website, docs/ and top-level Markdown or LICENSE files.
          docs='^(website/|docs/|[^/]+\.md$|LICENSE$)'
          if files="$(changed_files)" && [ -n "$files" ]; then
            printf 'Changed files:\n%s\n' "$files"
            if grep -qvE "$docs" <<<"$files"; then code=true; else code=false; fi
          else
            echo "Couldn't list the changed files for this $EVENT; running everything."
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Full run: $code"

  mock-gateway:
    name: Mock gateway selftest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mock-gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mock-gateway/package-lock.json
      - run: npm ci
      - run: npm run selftest

  # The Swift job builds for macOS only, so code behind `#if os(iOS)` would otherwise first be
  # compiled by a TestFlight archive (#421). This mirrors that archive, minus signing.
  ios:
    name: iOS build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the iOS app
        run: |
          xcodegen generate --quiet
          xcodebuild build \
            -project Pincer.xcodeproj \
            -scheme Pincer-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            | { command -v xcbeautify >/dev/null && xcbeautify || cat; }
          exit "${PIPESTATUS[0]}"

  # The Swift job runs the tests on macOS, where the UIKit list never loads. This runs the transcript suites
  # (hosted UIKit list, Dynamic Type parity, controller) against an iPhone simulator, booted headless by xcodebuild.
  # Includes streaming/committed row parity, off-main inline math, and WebKit SVG rasterization.
  ios-tests:
    name: iOS simulator tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # Pincer-Package would also build the macOS-only PincerChecks and PincerMacDev for iOS.
      - name: Make the test scheme
        run: scripts/ios-test-scheme.sh

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          phones = [d for runtime, devices in json.load(sys.stdin)["devices"].items() if "iOS" in runtime
                    for d in devices if d["name"].startswith("iPhone") and d["isAvailable"]]
          print(phones[0]["udid"] if phones else "")')"
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test the transcript lists on iOS
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme PincerUITests-iOS \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            -derivedDataPath .build/xcode-ios \
            -only-testing:PincerUITests/TranscriptUIKitHostedTests \
            -only-testing:PincerUITests/TranscriptUIKitLayoutTests \
            -only-testing:PincerUITests/TranscriptDynamicTypeParityTests \
            -only-testing:PincerUITests/TranscriptPremeasureTests \
            -only-testing:PincerUITests/TranscriptListControllerTests \
            -only-testing:PincerUITests/TranscriptMeasureQueueTests \
            -only-testing:PincerUITests/TranscriptLayoutCacheTests \
            -only-testing:PincerUITests/TranscriptWidthFreezeTests \
            -only-testing:PincerUITests/TranscriptFindTrimTests \
            -only-testing:PincerUITests/TranscriptNavigationTests \
            -only-testing:PincerUITests/TranscriptAccessibilityActionTests \
            -only-testing:PincerUITests/ScrollToBottomTests \
            -only-testing:PincerUITests/StreamingRenderingTests \
            -only-testing:PincerUITests/InlineMathOffMainTests \
            -only-testing:PincerUITests/SVGRasterizerTests \
            -only-testing:PincerUITests/ComposerSynchronousSizingUIKitTests \
            | { command -v xcbeautify >/dev/null && xcbeautify || cat; }

  swift:
    name: Swift build and checks
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      PINCER_KEYCHAIN: memory
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        id: xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mock-gateway/package-lock.json

      - name: Install mock gateway dependencies
        working-directory: mock-gateway
        run: npm ci

      # Checkout gives every file a new mtime, so file hashing keeps the restored build incremental.
      - name: Restore the build cache
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**') }}
          restore-keys: swiftpm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      - name: Build all targets and tests
        run: swift build --build-tests -Xswiftc -enable-incremental-file-hashing

      # Unit tests and every check run side by side, each live run against its own mock.
      - name: Unit tests and checks
        env:
          CHECKS_LOG_DIR: ${{ runner.temp }}/checks
        run: scripts/run-checks.sh -Xswiftc -enable-incremental-file-hashing

      # Opens a window: switching chats must not rebuild toolbar items, or the sidebar's buttons
      # flash (#262). Kept out of run-checks.sh so local runs don't pop up windows.
      - name: Toolbar stability on chat switch
        timeout-minutes: 3
        env:
          PINCER_DEV_NAMESPACE: toolbar-check
        run: |
          BIN="$(swift build --show-bin-path -Xswiftc -enable-incremental-file-hashing)"
          "$BIN/PincerMacDev" --toolbar-stability-check

      - name: Upload check logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: ${{ runner.temp }}/checks
          if-no-files-found: ignore
