name: Launch CPU

# scripts/check-launch-cpu.sh against a release build of the Mac app: fails if the app doesn't go
# idle after launch (#119: the menu bar item pinned the main thread). Runs nightly when main moved,
# on pull requests that change the check, and from the Actions tab.
on:
  schedule:
    - cron: "17 7 * * *"
  pull_request:
    paths: [".github/workflows/launch-cpu.yml", "scripts/check-launch-cpu.sh", "scripts/bundle-mac.sh"]
  workflow_dispatch:

concurrency:
  group: launch-cpu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A scheduled run only starts a macOS runner if main has commits from the last day.
  changed:
    name: Main moved?
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      recent: ${{ steps.check.outputs.recent }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          echo "Last commit on main: $((age / 3600))h ago"
          echo "recent=$([ "$age" -lt 90000 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  launch-cpu:
    name: Launch CPU check
    needs: changed
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.changed.outputs.recent == 'true') }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # No build cache: a nightly release build isn't worth evicting tests.yml's debug cache.
      - name: Build Pincer.app (release)
        run: scripts/bundle-mac.sh release

      # The #119 loop needs the menu bar item; the demo gateway connects at launch without a network.
      - name: Menu bar on, demo gateway
        run: scripts/check-launch-cpu.sh --menu-bar on --demo

      - name: Menu bar off, no gateway
        run: scripts/check-launch-cpu.sh --menu-bar off

      - name: Upload the app log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: launch-cpu-log
          path: build/cpu-check-state/app.log
          if-no-files-found: ignore
