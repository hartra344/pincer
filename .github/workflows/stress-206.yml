# TEMPORARY (#206): flake stress evidence. Removed before the PR merges.
name: Stress (#206)

on:
  push:
    branches: [hartra344-isolate-test-state-kill-flakes]
  workflow_dispatch:

concurrency:
  group: stress-206-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stress:
    name: ${{ matrix.mode }}
    runs-on: macos-26
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        mode: [back-to-back, parallel, unit-parallel]
    env:
      PINCER_KEYCHAIN: memory
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        id: xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mock-gateway/package-lock.json

      - working-directory: mock-gateway
        run: npm ci

      - uses: actions/cache/restore@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**') }}
          restore-keys: swiftpm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      - run: swift build --build-tests -Xswiftc -enable-incremental-file-hashing

      # Correctness failures (✗ lines / FAILED lanes; "timed out" alone is informational) count as flakes. The wall-clock perf
      # lanes are reported but not counted when three runs share the CPU on purpose.
      - name: Stress
        env:
          MODE: ${{ matrix.mode }}
          ROOT: ${{ runner.temp }}/stress
        run: |
          set -u
          mkdir -p "$ROOT"
          flakes=0
          one() { # name, port base
            CHECKS_LOG_DIR="$ROOT/$1" CHECKS_PORT_BASE=$2 scripts/run-checks.sh -Xswiftc -enable-incremental-file-hashing > "$ROOT/$1.out" 2>&1
            echo $? > "$ROOT/$1.code"
          }
          judge() { # name, ignore perf lanes?
            local out="$ROOT/$1.out" bad
            bad=$(grep -E "^[a-z-]+ +FAILED" "$out" | grep -vE "^perf-(smoke|tests) " || true)
            if [ "$2" = no ] && grep -qE "^perf-(smoke|tests) +FAILED" "$out"; then bad="$bad perf"; fi
            if [ -n "$bad" ] || grep -q "✗" "$ROOT/$1"/*.log 2>/dev/null; then
              flakes=$((flakes + 1)); echo "::error::$1 flaked: $bad"
              grep -H "✗" "$ROOT/$1"/*.log || true
            else
              echo "$1: clean"
            fi
            sed -n '/^Lane /,$p' "$out"
          }
          case "$MODE" in
            back-to-back)
              for i in $(seq 1 10); do one "run-$i" 18801; judge "run-$i" no; done ;;
            parallel)
              for round in 1 2; do
                for i in 1 2 3; do one "r$round-p$i" $((18800 + i * 10)) & done
                wait
                for i in 1 2 3; do judge "r$round-p$i" yes; done
              done ;;
            unit-parallel)
              for i in $(seq 1 10); do
                if swift test --skip-build --parallel -Xswiftc -enable-incremental-file-hashing > "$ROOT/unit-$i.out" 2>&1; then
                  echo "unit-$i: clean"
                else
                  flakes=$((flakes + 1)); echo "::error::unit-$i failed"; grep -E "✘|error|failed" "$ROOT/unit-$i.out" | head -40
                fi
              done ;;
          esac
          echo "FLAKES=$flakes"
          [ "$flakes" -eq 0 ]

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-${{ matrix.mode }}
          path: ${{ runner.temp }}/stress
          if-no-files-found: ignore
