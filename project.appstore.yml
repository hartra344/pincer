# Included by project.yml only when PINCER_APP_STORE_SIGNING=YES (CI TestFlight builds).
# Profiles and the Apple Distribution certificate come from repository secrets.
targets:
  Pincer-macOS:
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: Pincer_macOS_AppStore_CI
  Pincer-iOS:
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: Pincer_iOS_AppStore_CI
      # Per-configuration so it wins over project.yml's target-level `development` default,
      # which XcodeGen otherwise keeps over an included file's base setting.
      configs:
        Debug:
          PINCER_APS_ENVIRONMENT: production
        Release:
          PINCER_APS_ENVIRONMENT: production
  PincerNotifications-iOS:
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: Pincer_iOS_Notifications_AppStore_CI
  PincerShare-macOS:
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: Pincer_macOS_Share_AppStore_CI
  PincerShare-iOS:
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: Pincer_iOS_Share_AppStore_CI
