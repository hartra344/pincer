# XcodeGen spec: `xcodegen generate` → Pincer.xcodeproj (macOS + iOS apps).
name: Pincer
include:
  # CI-only: switches the app targets to manual App Store signing (see .github/workflows/testflight.yml).
  - path: project.appstore.yml
    enable: ${PINCER_APP_STORE_SIGNING}
options:
  bundleIdPrefix: chat.pincer
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
packages:
  Pincer:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: E4Y97NXBXG
targets:
  Pincer-macOS:
    type: application
    scheme: {}
    platform: macOS
    sources: [Apps/macOS, Apps/Shared]
    dependencies:
      - package: Pincer
        product: PincerUI
    settings:
      base:
        PRODUCT_NAME: Pincer
        PRODUCT_BUNDLE_IDENTIFIER: chat.pincer.mac
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/Pincer.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pincer
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  Pincer-iOS:
    type: application
    scheme: {}
    platform: iOS
    sources: [Apps/iOS, Apps/Shared]
    dependencies:
      - package: Pincer
        product: PincerUI
    settings:
      base:
        PRODUCT_NAME: Pincer
        PRODUCT_BUNDLE_IDENTIFIER: chat.pincer.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pincer
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Pincer connects to your OpenClaw Gateway on your local network or tailnet."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Attach photos to messages you send to your agents."
        TARGETED_DEVICE_FAMILY: "1,2"
